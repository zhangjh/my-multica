# Development override: build the backend image from the current checkout
# instead of pulling the official GHCR image. The web frontend is deployed to
# Cloudflare (see scripts/deploy-web-cloudflare.sh), not built here.

services:
  backend:
    image: multica-backend:dev
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-unknown}
        DATE: ${DATE:-unknown}
