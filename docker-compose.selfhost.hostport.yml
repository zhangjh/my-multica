# Host-side port publication for the postgres service, so processes running
# outside Docker (the native ./start.sh backend, psql, migrate) can reach the
# same database the compose stack uses. Kept as a separate override so the two
# upstream compose files stay untouched and `git pull` keeps merging cleanly.
#
#   docker compose -f docker-compose.selfhost.yml \
#                  -f docker-compose.selfhost.build.yml \
#                  -f docker-compose.selfhost.hostport.yml up -d postgres
#
# 127.0.0.1 only: never publish the database on a routable interface.
services:
  postgres:
    ports:
      - "127.0.0.1:${MULTICA_PG_HOST_PORT:-5433}:5432"
