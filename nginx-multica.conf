server {
	client_max_body_size 100M;
	listen 443 ssl;
	server_name tx-multica.zhangjh.cn;

	ssl_certificate /etc/nginx/cert/tx-multica.zhangjh.cn_bundle.pem;
	ssl_certificate_key /etc/nginx/cert/tx-multica.zhangjh.cn.key;

	## 配置解决流式结果一次返回问题
	proxy_buffering off;
	proxy_read_timeout 86400s;
	proxy_cache off;

	# CLI 可达性探测：`multica setup` 会 GET <server-url>/health 并要求 200
	location /health {
		proxy_pass http://127.0.0.1:8080;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	# 网页端 realtime WebSocket 直通 backend
	location /ws {
		proxy_pass http://127.0.0.1:8080;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	# daemon 长连接：{server-url}/api/daemon/ws
	location /api/daemon/ws {
		proxy_pass http://127.0.0.1:8080;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	# 其余路径交给 frontend；它会转发 API 和登录请求
	location / {
		proxy_pass http://127.0.0.1:3010;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

}